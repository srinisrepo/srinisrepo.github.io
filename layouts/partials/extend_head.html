<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=STIX+Two+Text:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&amp;display=swap" rel="stylesheet">

<script>
  (function () {
    var savedFont = localStorage.getItem('font-style');
    var dimText = localStorage.getItem('dim-text') === 'true';

    document.documentElement.classList.toggle('font-serif', savedFont === 'serif');
    document.documentElement.classList.toggle('text-dim', dimText);
  }());
</script>

{{ if .Param "math" }}
  {{ partialCached "math.html" . }}
{{ end }}
